<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Md Shahariar Ahmed, EIT | Mechanical Engineer</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;600;700&family=Public+Sans:wght@400;500;600&family=Source+Serif+4:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F6F8;--panel:#FFFFFF;--ink:#101828;--mute:#5B6676;--line:#E2E5EA;--pri:#0F2A47;--prink:#FFFFFF;--acc:#0E7C86;--soft:#EAF0F6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1118;--panel:#141B25;--ink:#E8ECF2;--mute:#9AA6B6;--line:#263041;--pri:#7FB4E6;--prink:#0C1118;--acc:#4FC3CC;--soft:#1B2634}}
:root[data-theme="dark"]{--bg:#0C1118;--panel:#141B25;--ink:#E8ECF2;--mute:#9AA6B6;--line:#263041;--pri:#7FB4E6;--prink:#0C1118;--acc:#4FC3CC;--soft:#1B2634}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;background:var(--bg);color:var(--ink)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.6}
a{color:inherit}
.wrap{max-width:1000px;margin:0 auto;padding:0 18px 90px}
.nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin:0 -18px;padding:10px 18px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
.nav .in{display:flex;gap:18px;align-items:center;max-width:1000px;margin:0 auto}
.nav .brand{font-family:"Source Serif 4",Georgia,serif;font-weight:700;text-decoration:none;white-space:nowrap}
.nav .links{display:flex;gap:16px;overflow-x:auto;flex:1;font-size:.92rem;color:var(--mute)}
.nav .links a{text-decoration:none;white-space:nowrap;padding:2px 0;border-bottom:2px solid transparent}
.nav .links a:hover,.nav .links a.on{color:var(--ink);border-color:var(--acc)}
h1,h2,h3{font-family:"Source Serif 4",Georgia,serif;font-weight:600;line-height:1.2;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(2rem,6vw,3rem)}
h2{font-size:1.45rem;margin:44px 0 6px}
h3{font-size:1.1rem}
.sub{color:var(--mute);margin:0 0 16px}
.hero{display:grid;gap:24px;padding:36px 0 8px}
@media (min-width:800px){.hero{grid-template-columns:1.4fr 1fr;align-items:center}}
.role{color:var(--acc);font-weight:500;margin:8px 0 0}
.lead{max-width:62ch;margin:14px 0 0;color:var(--ink)}
.photo{width:112px;height:112px;object-fit:cover;border-radius:50%;margin-bottom:14px;border:1px solid var(--line)}
.btn{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 16px;border-radius:6px;cursor:pointer;text-decoration:none;display:inline-block}
.btn.pri{background:var(--pri);color:var(--prink);border-color:var(--pri);font-weight:500}
.btn.sm{padding:3px 10px;font-size:.88rem}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.fig{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.fig a{background:var(--panel);padding:16px;text-decoration:none}
.fig a:hover{background:var(--soft)}
.fig b{display:block;font-family:"Source Serif 4",Georgia,serif;font-size:2rem;line-height:1.1;color:var(--pri)}
.fig span{color:var(--mute);font-size:.9rem}
.find{width:100%;font:inherit;font-size:16px;padding:11px 14px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
.res a{display:block;padding:10px 4px;border-bottom:1px solid var(--line);text-decoration:none}
.res small{color:var(--mute);display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.card{display:block;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;text-decoration:none}
.card:hover{border-color:var(--pri);box-shadow:0 2px 10px rgba(16,24,40,.08)}
.card h3{display:flex;justify-content:space-between;gap:8px}
.card p{margin:6px 0 0;color:var(--mute);font-size:.93rem}
.card .n{margin-top:10px;color:var(--acc);font-size:.88rem;font-weight:500}
.chart{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 16px}
.cr{display:grid;grid-template-columns:1fr;gap:4px;padding:10px 0;border-bottom:1px solid var(--line);text-decoration:none}
.cr:last-child{border-bottom:0}
.cr:hover .lbl{color:var(--acc)}
.cr .lbl{font-size:.93rem}
.cr .lbl small{color:var(--mute)}
.trk{position:relative;height:12px;background:var(--soft);border-radius:3px}
.bar{position:absolute;top:0;bottom:0;background:var(--pri);border-radius:3px;min-width:5px}
.bar.g{background:#9AA6B6}
.axis{position:relative;height:18px;font-size:.78rem;color:var(--mute);margin-top:6px}
.axis span{position:absolute;transform:translateX(-50%)}
.ba{display:grid;grid-template-columns:54px 1fr 54px;gap:8px;align-items:center;font-size:.88rem}
.ba .v{text-align:right;font-weight:600}
.drop{color:var(--acc);font-weight:600}
.crumb{padding:18px 0 4px;font-size:.9rem;color:var(--mute)}
.crumb a{color:var(--acc)}
.meta{color:var(--mute);margin:6px 0 0}
.list{margin-top:16px;background:var(--panel);border:1px solid var(--line);border-radius:8px}
.list a{display:flex;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);text-decoration:none}
.list a:last-child{border-bottom:0}
.list a:hover{background:var(--soft)}
.list .t{font-weight:600}
.list .s{color:var(--mute);font-size:.93rem;margin-top:2px}
.list .go{color:var(--mute);align-self:center}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 0}
.tag{border:1px solid var(--line);border-radius:4px;padding:1px 9px;font-size:.82rem;color:var(--mute);background:var(--panel);font-family:inherit;cursor:pointer}
.tag[aria-pressed=true]{background:var(--pri);color:var(--prink);border-color:var(--pri)}
.story p{max-width:66ch;margin:0 0 14px}
.points{max-width:66ch;padding-left:20px}
.points li{margin:5px 0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 16px;margin:18px 0;max-width:640px}
.media{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin:20px 0}
.media figure{margin:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.media img{width:100%;display:block}
.media figcaption{padding:6px 10px;color:var(--mute);font-size:.9rem}
.media a.lnk{display:block;padding:14px;border:1px solid var(--line);border-radius:8px;background:var(--panel);text-decoration:none;font-weight:500}
.media a.lnk small{display:block;color:var(--mute);font-weight:400}
.pn{display:flex;justify-content:space-between;gap:10px;margin-top:30px}
.form{border:1px solid var(--acc);background:var(--panel);padding:16px;margin-top:18px;max-width:700px;border-radius:8px}
.form label{display:block;font-weight:500;margin:12px 0 4px;font-size:.92rem}
.form input[type=text],.form textarea{width:100%;font:inherit;font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.form textarea{min-height:90px}
.form .mi{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);padding:6px 10px;margin:6px 0;gap:8px;border-radius:6px}
.form .mi img{height:44px}
.pub{position:fixed;left:0;right:0;bottom:0;padding:10px 18px calc(10px + env(safe-area-inset-bottom,0px));background:var(--pri);color:var(--prink);display:flex;gap:10px;align-items:center;justify-content:space-between;z-index:9}
.pub .btn{border-color:var(--prink)}
.foot{margin-top:56px;padding-top:16px;border-top:1px solid var(--line);color:var(--mute);font-size:.9rem}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* v8 navigation layer */
:root{--tabh:64px;--rail:96px}
.skip{position:absolute;left:-9999px;top:0;background:var(--pri);color:var(--prink);padding:10px 14px;border:0;border-radius:0 0 8px 0;font:inherit}
.skip:focus{left:0;z-index:60}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:19}
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.appbar .in{display:flex;align-items:center;justify-content:space-between;gap:8px;max-width:760px;margin:0 auto;padding:0 8px 0 16px;min-height:56px}
.appbar .brand{font-family:"Source Serif 4",Georgia,serif;font-weight:700;font-size:1.05rem;text-decoration:none;padding:8px 0}
.appbar .back{display:inline-flex;align-items:center;gap:2px;min-height:48px;margin-left:-10px;padding:0 12px 0 6px;text-decoration:none;color:var(--acc);font-weight:600;max-width:60%;border-radius:24px}
.appbar .back span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.appbar .back:hover{background:var(--soft)}
.acts{display:flex;align-items:center;gap:2px}
.ib{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:48px;min-height:48px;border-radius:24px;text-decoration:none;color:var(--ink)}
.ib:hover{background:var(--soft)}
.ib .lb{display:none;font-size:.9rem}
@media (min-width:640px){.ib{padding:0 14px}.ib .lb{display:inline}}
.ico{display:inline-flex;flex:none}
.wrap{max-width:760px;margin:0 auto;padding:0 16px calc(var(--tabh) + 32px)}
.pt{font-size:clamp(1.8rem,6vw,2.4rem);margin:22px 0 4px}
.hero{display:block;padding:22px 0 4px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs a{flex:1;min-width:0;min-height:var(--tabh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px 2px;text-decoration:none;color:var(--mute);font-size:.72rem;line-height:1.1}
.tabs .pill{display:grid;place-items:center;width:56px;height:30px;border-radius:15px}
.tabs a.on{color:var(--ink);font-weight:600}
.tabs a.on .pill{background:var(--soft);color:var(--pri)}
.tabs .lb{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pub{bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px));padding-bottom:10px}
.btn{min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.sm{min-height:40px;padding:3px 12px}
.searchbar{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 16px;margin:18px 0 0;border:1px solid var(--line);border-radius:24px;background:var(--panel);color:var(--mute);text-decoration:none}
.searchbar:hover{border-color:var(--pri)}
.menu{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.menu a{display:flex;align-items:center;gap:14px;min-height:68px;padding:12px 16px;text-decoration:none;border-bottom:1px solid var(--line)}
.menu a:last-child{border-bottom:0}
.menu a:hover{background:var(--soft)}
.menu .ic{width:42px;height:42px;border-radius:50%;background:var(--soft);color:var(--pri);display:grid;place-items:center;flex:none}
.menu .tx{flex:1;min-width:0}
.menu .tx b{display:block;font-weight:600}
.menu .tx span{color:var(--mute);font-size:.9rem}
.menu .go,.list .go{color:var(--mute);align-self:center}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(84px,1fr);gap:2px;overflow-x:auto;background:var(--soft);border-radius:12px;padding:3px;margin:14px 0 10px}
.seg a{display:flex;align-items:center;justify-content:center;text-align:center;min-height:44px;padding:6px 8px;border-radius:9px;text-decoration:none;color:var(--mute);font-size:.88rem;line-height:1.2}
.seg a[aria-current=page]{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(16,24,40,.14)}
.list{margin-top:12px}
.list a{align-items:center;min-height:64px}
.list .f{color:var(--acc);font-size:.85rem}
.pn{align-items:center}
.pn .c{color:var(--mute);font-size:.9rem}
button.tag{min-height:40px;padding:4px 14px;border-radius:20px}
.empty{padding:28px 16px;margin-top:12px;text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:12px}
.fig a{min-height:76px}
.panel .ba span,.panel .ba a{overflow-wrap:anywhere;min-width:0}
@media (min-width:900px){
 .tabs{top:0;right:auto;width:var(--rail);flex-direction:column;justify-content:flex-start;gap:4px;padding:16px 6px;border-top:0;border-right:1px solid var(--line)}
 .tabs a{flex:none;min-height:0;padding:10px 2px}
 .appbar,.wrap{margin-left:var(--rail)}
 .appbar .in,.wrap{max-width:760px}
 .wrap{padding-bottom:48px}
 .pub{left:var(--rail);bottom:0}
}
@media (min-width:900px) and (min-width:1100px){.appbar,.wrap{margin-left:calc(var(--rail) + (100% - var(--rail) - 760px)/2)}}

/* v9: menu, pages, access */
button.ib{background:none;border:0;font:inherit;color:var(--ink);cursor:pointer}
.acts{flex:none}.appbar .back{min-width:0}
.drawer{position:fixed;top:0;left:0;right:0;bottom:0;z-index:40}
.drawer[hidden]{display:none}
.drawer .scrim{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(10,16,24,.5)}
.drawer .sheet{position:absolute;top:0;right:0;bottom:0;width:min(340px,88vw);background:var(--panel);border-left:1px solid var(--line);padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);display:flex;flex-direction:column;box-shadow:-8px 0 24px rgba(0,0,0,.2)}
.sheet .sh{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);min-height:56px}
.sheet a{display:block;padding:16px;min-height:68px;text-decoration:none;border-bottom:1px solid var(--line)}
.sheet a:hover{background:var(--soft)}
.sheet a b{display:block;font-weight:600}
.sheet a span{color:var(--mute);font-size:.9rem}
.menu .st{padding:14px 16px;border-bottom:1px solid var(--line)}
.menu .st:last-child{border-bottom:0}
.menu .st b{display:block}
.menu .st p{margin:4px 0 0;color:var(--mute)}
select.acc{font:inherit;font-size:.88rem;min-height:40px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);padding:0 8px;max-width:100%}
.form .mi{flex-wrap:wrap}
.form small{display:block;margin-top:8px;color:var(--mute)}

/* v17: motion, play tour, modern touches */
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(18px,-14px) scale(1.08)}}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.wrap{animation:up .45s cubic-bezier(.2,.8,.2,1) both}
.rv{opacity:0;transform:translateY(14px);transition:opacity .55s ease,transform .55s cubic-bezier(.2,.8,.2,1);transition-delay:calc(var(--d,0)*55ms)}
.rv.in{opacity:1;transform:none}
.hero{position:relative;isolation:isolate}
.hero::before{content:"";position:absolute;z-index:-1;right:-30px;top:-10px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,var(--acc),transparent 68%);opacity:.18;animation:drift 9s ease-in-out infinite;pointer-events:none}
.hero h1{animation:up .7s .05s both}.hero .role{animation:up .7s .15s both}.hero .lead{animation:up .7s .25s both}.hero .row{animation:up .7s .35s both}
.hero h1{background:linear-gradient(90deg,var(--ink),var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent}
.btn,.list a,.menu a,.fig a,.card,.tabs .pill,.ib{transition:transform .18s ease,box-shadow .18s ease,background .18s ease,border-color .18s ease}
.btn:active,.ib:active{transform:scale(.94)}
@media (hover:hover){.list a:hover,.menu a:hover{transform:translateX(3px)}.fig a:hover,.card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(16,24,40,.12)}}
.tabs a.on .pill{animation:pop .3s ease}
.chart .bar{transform:scaleX(0);transform-origin:left;transition:transform 1s cubic-bezier(.2,.8,.2,1)}
.chart.in .bar{transform:scaleX(1)}
.chart .cr:nth-child(2) .bar{transition-delay:.1s}.chart .cr:nth-child(3) .bar{transition-delay:.2s}.chart .cr:nth-child(4) .bar{transition-delay:.3s}.chart .cr:nth-child(5) .bar{transition-delay:.4s}
#sp{position:fixed;top:0;left:0;right:0;height:3px;z-index:60;background:linear-gradient(90deg,var(--acc),var(--pri));transform:scaleX(0);transform-origin:left;pointer-events:none}
#up{position:fixed;right:14px;bottom:calc(var(--tabh) + 16px + env(safe-area-inset-bottom,0px));z-index:25;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--ink);display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.18);opacity:0;transform:translateY(10px);pointer-events:none;transition:opacity .25s,transform .25s}
#up.on{opacity:1;transform:none;pointer-events:auto}
@media (min-width:900px){#up{bottom:22px}}
.btn.play{background:linear-gradient(135deg,var(--acc),var(--pri));color:#fff;border-color:transparent;font-weight:600;box-shadow:0 4px 14px rgba(14,124,134,.35)}
.pl{position:fixed;inset:0;z-index:100;background:radial-gradient(120% 90% at 20% 0%,#16456f,#0a1b2e 70%);color:#fff;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);animation:pop .3s ease}
.pl[hidden]{display:none}
.pl .seg2{display:flex;gap:5px;padding:14px 16px 0}
.pl .seg2 i{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.22);overflow:hidden}
.pl .seg2 i b{display:block;height:100%;width:0;background:#4FC3CC}
.pl .top{display:flex;justify-content:space-between;align-items:center;padding:8px 12px 0 18px;font-size:.85rem;opacity:.8}
.pl .stage{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:18px 22px}
.pl .sl{width:100%;max-width:640px}
.pl .sl>*{animation:up .6s both;animation-delay:calc(var(--i,0)*90ms)}
.pl .k{color:#4FC3CC;font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:.8rem;margin:0 0 10px}
.pl h2.t{font-family:"Source Serif 4",Georgia,serif;font-size:clamp(1.7rem,6vw,2.6rem);line-height:1.15;margin:0 0 18px}
.pl .big{font-family:"Source Serif 4",Georgia,serif;font-size:clamp(2.2rem,9vw,4rem);line-height:1.05;margin:0 0 12px}
.pl p.d{opacity:.85;margin:0 0 8px;font-size:1.05rem}
.pl .tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pl .tile{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:16px}
.pl .tile b{display:block;font-family:"Source Serif 4",Georgia,serif;font-size:2.4rem;line-height:1}
.pl .tile span{opacity:.8;font-size:.9rem}
.pl .rw{border-left:3px solid #4FC3CC;padding:4px 0 4px 14px;margin:0 0 14px}
.pl .rw b{display:block;font-size:1.08rem}.pl .rw span{opacity:.75;font-size:.92rem}
.pl .vs{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.pl .vs s{opacity:.55;font-size:1.4rem}.pl .vs strong{font-family:"Source Serif 4",Georgia,serif;font-size:2.4rem}
.pl .vs em{font-style:normal;background:#4FC3CC;color:#08202f;border-radius:20px;padding:2px 10px;font-weight:700;font-size:.9rem}
.pl .vrow{margin:0 0 18px}.pl .vrow small{opacity:.8;display:block}
.pl .ctl{display:flex;justify-content:center;align-items:center;gap:10px;padding:10px 16px 16px}
.pl .cb{min-width:48px;height:48px;border-radius:24px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;font:inherit;font-weight:600;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0 14px}
.pl .cb:hover{background:rgba(255,255,255,.18)}
.pl .cb.main{background:#4FC3CC;color:#08202f;border-color:#4FC3CC;width:60px;height:60px;border-radius:30px}
.pl .go{display:inline-flex;margin:12px 10px 0 0;text-decoration:none;color:#08202f;background:#4FC3CC;border:0;border-radius:24px;min-height:46px;align-items:center;padding:0 20px;font:inherit;font-weight:600;cursor:pointer}
.pl .go.o{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.35)}

wUGAAAAABAAEAAxBAAAGc0BAAAA","m":"Sheet 1 is the capacity study form. Header fields: product name and model, building and floor, operating unit, date, department, studied by, section and sub-section, study number.\n\nFor each operation it records: machine or manual, manpower, machine parameters, pieces required per unit, pieces per cycle, ten cycle-time readings, average cycle time, rating %, basic time, allowance %, SAM (standard minutes) and capacity per hour. The sheet has a worked example for a punching operation (26.5 s average cycle, 4 pieces per cycle, about 260 pieces per hour).\n\nSheet 2 is a production capacity analysis for a 17-inch rechargeable fan line with a target of 100 per hour. It lists assembly and packing steps with cycle time, capacity per hour, manpower needed against allocated, and utilization %.","o":"walton","a":"view"},{"k":"link","c":"Video: handling small metal jigs by hand","n":"Media1.mp4","d":"Shop-floor clip: an operator handling small metal cylinder jigs on a perforated fixture by hand.","u":"https://drive.google.com/file/d/1DQcuYRp6JGID93_To3Y-wFFM1D4q5UXJ/view","m":"One of six videos (Media1 to Media6) recorded on the Walton TV floor to show real process conditions and machine behaviour.","o":"walton"},{"k":"link","c":"Video: part on a machine press fixture","n":"Media4.mp4","d":"Short clip: a small part held on a machine press fixture.","u":"https://drive.google.com/file/d/1Un8MShnMOtKbnOPYX-fKxEtR50jLRIh3/view","m":"One of six videos (Media1 to Media6) recorded on the Walton TV floor to show real process conditions and machine behaviour.","o":"walton"},{"k":"link","c":"Video: press fixing a small part","n":"Media2.mp4","d":"Clip: a press machine fixing a small part on a fixture, with a meter beside it.","u":"https://drive.google.com/file/d/10d8-oQQYNO1TYclHXu6XqDEU98DwZaZn/view","m":"One of six videos (Media1 to Media6) recorded on the Walton TV floor to show real process conditions and machine behaviour.","o":"walton"},{"k":"li or plastic parts\n- Optical film, LGP and open cell fitting, Al channel processing\n- Styrofoam and carton packaging\n2. Vertical integration map: which processes Walton does in-house and which it outsources.","u":"https://drive.google.com/file/d/11hzatyzqdrranIUev2baqqPKq9JAWQxE/view","a":"open","o":"walton"},{"k":"link","c":"Speaker fault percentage comparison (PDF)","n":"Speaker_Fault_Comparison.pdf","d":"PDF version of the speaker fault percentage comparison.","m":"Compares the fault percentage of TV speakers. Speaker faults feed after-sales claims, so tracking them guides assembly process improvement. The Excel version is listed above.","u":"https://drive.google.com/file/d/1_0tf9LdOsdyhtG7SuvKX93wzor3Sh7US/view","a":"open","o":"walton"},{"k":"link","c":"Product Support folder","n":"Product_Support_Folder","d":"Main working folder of the Product Support and Process Development team.","m":"Working folder of the Product Support and Process Development team: project files, reports and supporting documents for improvement, cost saving, SOP and CTQ work.","u":"https://drive.google.com/drive/folders/13W8DmLBdGTnsAlpRo-8XZ-I2NSq1Afe_","a":"open","o":"walton"},{"k":"link","c":"Video: Media5, Walton process footage","n":"Media5.mp4","d":"Shop-floor process video from the Walton TV development work.","m":"Part of a six-video series (Media1 to Media6) recorded on the Walton TV floor to document processes, machines and improvement activities.","u":"https://drive.google.com/file/d/1osFE8hgJxuOA9oaxyipYVvErLkwFZwcL/view","a":"open","o":"walton"},{"k":"link","c":"Video: Media6, Walton process footage","n":"Media6.mp4","d":"Last video in the Media series from the Walton TV floor.","m":"Final video of the six-video series (Media1 to Media6) recorded on the Walton TV floor.","u":"https://drive.google.com/file/d/1qzzWxziAzq99XsjCiKOTGCjnvTj3RQ0L/view","a":"open","o":"walton"},{"k":"link","c":"Procedure for product design and development, 1 Nov 2021","n":"Procedure_Product_Design_Development_2021-11-01.xlsx","d":"Walton procedure for product design and development, dated 1 November 2021.","m":"The standard procedure for product design and development at Walton, dated 1 November 2021. It sets a controlled, stage-gated process for new TV product development.","u":"https://drive.google.com/file/d/1p5hj2Qf3T-a83Ln88rSnc6kMSn49HpIS/view","a":"view","o":"walton"},{"k":"link","c":"Five-year budget format, TV division","n":"Five_Years_Budget_Format_TV_2021-05-22.xlsx","d":"Five-year budget format for the TV division, dated 22 May 2021.","m":"Five-year budget format designed for the TV division, dated 22 May 2021. Used for long-term financial planning of manpower, material, overhead and capital expenditure.","u":"https://drive.google.com/file/d/1yxArOB3q1ngEo2bGAcmptNZJobtx4cvQ/view","a":"view","o":"walton"},{"k":"link","c":"Merged PDF (iLovePDF)","n":"ilovepdf_merged_14.pdf","d":"Small merged PDF made with iLovePDF.","m":"Small merged PDF (about 62 KB) made with iLovePDF. Contents not identified.","e":{"s":"72i67/1NIONHnvKyeiQwpA==","i":"oMaIVTb642iyxYl8","d":"rEFeJ1Y57VC6KToVcSB0c9+n03YLlQQbArGRJ0PXk83HNEREnO5HqGm02jNnaW/CM5rWXYRb2ZUY1kvRSfvC8f6s+X8eRsb5FR55L4wyGlF2mQIvd2o="},"a":"code","o":"walton"},{"k":"link","c":"Screenshot, 31 Aug 2025","n":"Screenshot_2025-08-31_141833.pdf","d":"PDF of a screenshot taken 31 Aug 2025.","m":"PDF of a screenshot taken on 31 August 2025 at 14:18. Contents not identified.","e":{"s":"D/zRQ0NfTh07Wuez1U14MQ==","i":"SmZB8RzglUbatXfE","d":"VJMpWrC4XE/lrnebxH+kmi6tB76Z6GfczAUI5ApGfIN6igHjL+SwxMtnFlReQ2k7O53/PqognJ+vXXKeibgHalCkJBgEMPLsqAfqfGs/yOip5EB2j+c="},"a":"code","o":"walton"},{"k":"link","c":"Text file","n":"dro.txt","d":"Small text file.","m":"Small text file. Contents not identified.","e":{"s":"C7QXZNS54toiNqLED1lJnw==","i":"w56WcKj8umQkiewF","d":"C6mka193ed+0S4cWFRx+13iUIqZFaJe6BWm9cxr+fcRz4T4AL3mQ/hI8W9czLX+QtQsc/6oKVzFDFBOM603/48ZQ8yAUMBEBrWwNzCxy1aQzBR7pMqw="},"a":"code","o":"walton"},{"k":"link","c":"Banking (Customer Service folder)","n":"Banking_Google_Doc","d":"Administrative document from the Walton Customer Service folder.","m":"Google Doc kept in the Walton Customer Service folder. Private administrative file.","e":{"s":"vRSF11Nnio2+l2MsiiQrfw==","i":"Qb5I0ONY+v8YTast","d":"WvBWr+ve2bKW7EEpKOYCn89SsntcEBrJcZabqkMS2ESOMWYIrnyL43qjRw2o9gFoDgmtVHhYsyOFqMANT2tPOq2wjJEl4HzQHxyoUT3ftwon2TiTI6DHOhG+/Pi4PuNq9g=="},"a":"code","o":"walton"},{"k":"link","c":"WD24RG21 panel update, editable PowerPoint","n":"WD24RG21_Panel_Production_Update_Small_Size.pptx","d":"PowerPoint version of the WD24RG21 open cell broken rate update.","m":"PowerPoint version of the WD24RG21 panel production update. Presents the results of the process change that reduced the open cell broken rate on the small-size model, with before-and-after data and an improvement summary.","u":"https://drive.google.com/file/d/1lTz-wU4fMVjSEGSJEm_GrwRFYJjxCfFC/view","a":"view","o":"walton"}]},{"id":"c4","t":"Quality Assurance in-charge","m":"Rahimafrooz Globatt (batteries), Aug 2017 to Oct 2020","s":"Battery testing, supplier evaluation, SPC and root cause under ISO systems.","b":"","p":["Battery quality and performance testing","Incoming raw material and supplier evaluation with FMEA","Process capability (Cpk) and monthly Manufacturing Quality Index reports","Non-conformance reports and corrective action","ISO 9001:2015, ISO 14001:2015, OHSAS 18001:2007","Competitor benchmarking of quality and service data"],"g":["Quality"],"x":[]},{"id":"c5","t":"Production role","m":"Export-1 / Durable Plastic (PRAN-RFL Group), Feb to Aug 2017","s":"Production, cycle time, manpower and SolidWorks designs.","b":"","p":["Production cycle time and manpower","Production designs in SolidWorks","PDCA to reduce cycle time","Fishbone and failure-mode analysis to find critical quality factors"],"g":["Production"],"x":[]}]},{"id":"projects","title":"Projects","blurb":"Machines, process fixes and tools I delivered.","items":[{"id":"p1","t":"Voice coil jig removal machine","m":"Walton, speaker section","s":"15 s down to 9 s for 6 pieces, in three phases.","b":"Removing voice coil jigs by hand was slow and risked tearing the wire. A hand-pressed fixture came first, but operators got blisters after an 8-hour shift. Our in-house machine-making section then built a machine removing one jig per press, and finally six per press.","p":["Phase 1: hand-pressed jig and fixture","Phase 2: machine, 1 jig per press","Phase 3: machine, 6 jigs per press"],"g":["Machines","Improvement"],"x":[{"k":"link","c":"Voice coil folder","n":"Voice_Coil_Folder","d":"Drive folder for voice coil work: speaker component, assembly, quality and cost.","m":"Technical, quality and cost documents for the voice coil, a critical speaker component. Supports the jig removal machine work and speaker quality and cost improvement.","u":"https://drive.google.com/drive/folders/1JlJuWvxWZcJxCwOhoJ2qydmZHoJajTh_","a":"open","o":"walton"}],"v":{"l":"Cycle time, 6 pieces","a":15,"b":9,"u":" s"}},{"id":"p2","t":"Tweeter removal, RU-55 speaker rework","m":"Walton","s":"20 s by hammer down to 6 s with a jig machine.","b":"Tweeters were removed by hammering, which was slow and could damage them. A machine from our machine-making section removes 6 jigs in one press.","p":[],"g":["Machines","Improvement"],"x":[],"v":{"l":"Cycle time","a":20,"b":6,"u":" s"}},{"id":"p3","t":"Open-cell breakage fix, WD24RG21 panel","m":"Walton","s":"Tape change validated by vibration, shock and transport tests.","b":"The open cell moved and broke. Replacing the rubber tape with double-sided tape stopped the movement. The Research & Innovation department validated it with vibration, shock and transportation simulation tests. Breakage was eliminated, rework dropped and efficiency improved.","p":[],"g":["Testing","Quality"],"x":[]},{"id":"p4","t":"Cabinet transport ramp","m":"Walton","s":"Crew of 6 reduced to 2, hand lifts 6 to 1.","b":"Metal back cabinets were carried by hand between Building 7 and Building 1, risking damage and micro cracks in the open cell. We designed a ramp with a tractor and modified trolley, with a gearbox-driven ramp built by the machine-making section.","p":[],"g":["Improvement","Safety"],"x":[],"v":{"l":"People to move a cabinet","a":6,"b":2,"u":""}},{"id":"p5","t":"400-ton power press","m":"Walton","s":"Feasibility, layout and site readiness.","b":"Feasibility analysis, quotation and proforma invoice, Gantt chart and proposed layout. Placement and shed work were completed and the project was waiting for the supplier when I left in April 2023. Servo tapping work was set to resume after its installation.","p":[],"g":["Machines","Projects"],"x":[{"k":"link","c":"Sheet metal capacity study and 400-ton press justification","n":"400Ton.pdf","d":"Machine-hour study showing why a second 400-ton H-frame double crank press was needed.","m":"Capacity analysis of the Walton sheet metal section. It calculates the hours each machine type needs for each TV model and compares that with the capacity on hand.\n- Machine types covered: forming, trimming, punching, folding, bending, rivet\n- Demand considered: about 80,000 pieces\n- Finding: existing machines cannot meet the required output, with a clear shortage in 400-ton capacity\n- Recommendation: buy 1 more 400-ton H-frame double crank press\nMachines in the summary: 600 ton 1 (existing), 400 ton 1 existing plus 1 needed, 300 ton 1, 250 ton 5, 200 ton 1.\nThe document carries sign-offs from several Additional Directors and Executive Directors.","u":"https://drive.google.com/file/d/1VlRFTU08LYAGbY_6v6d72zksAU84_t2I/view","a":"open","o":"walton"},{"k":"link","c":"Sheet metal section layout, shed expansion","n":"WBL-B07-L1_TV_SM_2021-12-01.pdf","d":"Layout drawing (WBL-B07-L1, 1 Dec 2021) of the TV sheet metal section with the proposed expansion.","m":"Engineering layout of the TV sheet metal section, showing the present state and the plan.\n- Existing machine layout\n- Proposed shed expansion area\n- Proposed relocation of power presses\n- Placement of 200, 250, 300, 400 and 600 ton presses\n- Work areas, power distribution and safety zones\nPrepared to support the added press capacity and to place the machines well.","u":"https://drive.google.com/file/d/1vi15qOKaCV0EKZJkpX_0z7WbnayRH4t3/view","a":"open","o":"walton"}]},{"id":"p6","t":"Hot stamping machine","m":"Walton","s":"Installation done, product trials running.","b":"","p":["Installation completed","Product trial in progress"],"g":["Machines"],"x":[]},{"id":"p7","t":"Open-cell sealant dispensing line and cleanroom","m":"Walton","s":"Feasibility, 3D conveyor design and workplan.","b":"The open cell is an expensive TV component, so consistent sealant application affects quality and claims. I prepared the feasibility and costing analysis, proposed layout, a 3D conveyor design and a robotics automation concept, and finalised the workplan.","p":[],"g":["Projects","Cleanroom"],"x":[{"k":"link","c":"Costing feasibility analysis","n":"Open_Cell_Sealant_Feasibility.pdf","d":"Investment 3.57 crore BDT, NPV 4.92 crore, IRR 43% to 53%, payback under 2.1 years.","m":"Financial feasibility study for setting up an open cell sealant process in TV panel manufacturing. It tests whether the investment pays back through fewer after-sales service claims.\n- Basis: 40,000 TVs a month, saving of 103.76 Taka per TV\n- Total investment: 3.57 crore BDT\n- Five-year savings: 9.86 crore BDT. NPV: 4.92 crore BDT\n- IRR: 43.10% to 53.08%. ROI: 55.24% a year\n- Payback: 1.84 to 2.09 years. Discounted payback: 2.10 to 2.24 years\nAssumptions and limits: the solvable share of open cell claims was taken as 60%, from R&D data. If the solvable share falls below 10% of claim quantity, the project is not feasible.\nThe study recommends the project on financial grounds. If open cell technology changes later, the machinery can still be used in TV assembly or the panel line.","u":"https://drive.google.com/file/d/1WgeE9QvOtcMB8YLlYDcSwXVSpa-oyfbz/view","a":"open","o":"walton"},{"k":"link","c":"Feasibility report (40K a month)","n":"Feasibility_Report.pdf","d":"Companion feasibility report at 40,000 TVs a month.","m":"The first of the two feasibility documents for this project. It sets out the investment case that the costing analysis then tests. See the costing analysis for the full list of figures, including investment, NPV, IRR and payback.","u":"https://drive.google.com/file/d/19k7uAXm6OTEhxtBHirW6ZcHsQ0MG-eC4/view","a":"open","o":"walton"},{"k":"link","c":"Project management dashboard, sealant dispensing","n":"WTV_Project_Management_6.02.22.pdf","d":"Task tracker and Gantt view for the sealant dispensing project, 24 May 2021 to 9 Aug 2022.","m":"Dashboard I used to track the sealant dispensing project from start to finish.\n- Duration: 24 May 2021 to 9 August 2022\n- Tracks every task by team: R&I, SED, Process, Maintenance, HVAC, Purchase, SCM\n- For each task: start, end, duration and percent complete\n- Budget against actual spending, plus a Gantt-style timeline\nActivities covered: feasibility and requirement document, machine sourcing (MET Tech and FANUC), layout versions V-1 to V-10, cleanroom design, servo-controlled dispensing gun, installation and commissioning.\nMost tasks are marked 100% complete. Long machine manufacturing lead time caused some delay.","u":"https://drive.google.com/file/d/1vcsOeOUSYcQLm-pdltuLyWwmUIyUMaem/view","a":"open","o":"walton"},{"k":"link","c":"Cleanroom floor plan, optical film cutting area","n":"Proposed_Sealant_Project.pdf","d":"Layout drawing for modifying the optical film cutting cleanroom to host the LCM sealant project.","m":"Engineering floor plan for the cleanroom modification. Location: Building-01, ground floor, existing plan Block-B.\n- Curing zone with temperature and humidity control\n- Optical film cutting zone\n- ESD-protected areas\n- Storage areas, dressing room, doors and process flow paths\n- Equipment placement marked in colour\nThe zoning separates the clean processes to avoid contamination.","u":"https://drive.google.com/file/d/1oP6p7GkQkk01dTIvQc-4hb_uQQnRcPEW/view","a":"open","o":"walton"},{"k":"link","c":"Project management tracker (Excel), sealant dispensing","n":"WTV_Project_Management_6.02.22.xlsx","d":"Working Excel version of the sealant project dashboard, with formulas and filters.","m":"The editable companion to the PDF dashboard dated 6 Feb 2022.\n- Task list with start and end dates, duration, percent complete, owner and status\n- Budget against actual cost by category: machine, civil, electrical, HVAC and more\n- Conditional formatting for delayed or over-budget items\n- Summary sheet of overall progress and remaining work\n- Resource loading and milestone tracking\nMajor milestones (machine arrival, cleanroom readiness, installation, trial runs) are marked complete. A few late-stage items for final validation and documentation remain open.\nThe project team used it day to day to control progress, cost and schedule.","u":"https://drive.google.com/file/d/1wsJ5cRGgF9Hec9hTycscqM6J91AelnRz/view","a":"view","o":"walton"},{"k":"link","c":"Open cell sealant project: feasibility workbook","n":"Open_Cell_Sealant_Feasibility.xlsx","d":"The workbook behind the feasibility study: assumptions, cash flow and financial metrics.","u":"https://drive.google.com/file/d/1932dB5etANz3nV3_2t18Xw2bq1zLREE_/view","m":"Working Excel behind the sealant costing study: assumptions, cash flow and financial metrics.","o":"walton","a":"view"},{"k":"link","c":"MET open cell sealant project concept video, v4","n":"MET_Opencell_Sealant_Concept_v4.mp4","d":"Confidential concept video (version 4) for the open cell sealant project.","m":"Confidential concept video, version 4, explaining the MET open cell sealant project.","e":{"s":"AecCen29YVfKPhr2nsgeiA==","i":"acORAabvo2/cJbMg","d":"yuR+1rxpdJfnMpk86DpCzeJ39eQMBTFxskSZpTOaxMFUHEDUTXcnpVrEzH8K3UDgqZG3MZh4zFC+yoZQ/6EHoypNXK465FtLcISXpuFBlYKInw49Tq4="},"a":"code","o":"walton"}]},{"id":"p8","t":"Other Walton machine projects","m":"Walton","s":"Cutting, press, tapping, sealing, blasting, engraving and more.","b":"","p":["U-yoke cutting machine: installation completed","Stand-bush press machine: installation completed","TSD cleanroom: modification completed","Auto sealing machine: approved, in-house modification","Sand blasting, highlighting and engraving machines: approval and supplier installation pending","Knurling nut: cost feasibility. PAD painting: second trial with a different chemical ratio","Conformal coating: exploring in-house support"],"g":["Machines"],"x":[{"k":"link","c":"Knurling nut cost comparison: rivet vs in-mold nut","n":"Knurling_Nut_Cost_Comparison.pdf","d":"Cost-benefit analysis of changing from a rivet to an in-mold nut in TV assembly.","m":"Side-by-side costing of the rivet method and the in-mold nut method.\n- Item-wise table: unit price, total price, weight, margin and monthly cost\n- Rivet items and in-mold nut items calculated separately\n- Material cost and process cost compared\n- Monthly and annual saving worked out\nSwitching to the in-mold nut lowers cost and improves process efficiency and quality.","u":"https://drive.google.com/file/d/14pmZ48UkyNN2cTLgi_P87MicEcwkikJR/view","a":"open","o":"walton"},{"k":"link","c":"In-mold nut manufacturing drawings (21 pages)","n":"In_Mold_Nut_TV_2021-03-15_rev00.pdf","d":"Production drawing set for the in-mold nut, dated 15 March 2021, revision 00.","m":"Complete manufacturing drawings for the in-mold nut that replaces the rivet in TV plastic parts.\n- Part: IN MOLD NUT 1, thread M4 x 0.7 mm\n- Outer diameter 7 mm (-0.05), body diameter 6 mm (+/-0.05)\n- Inner hole 3.4 mm (-0.1), total height 9 mm (+0.1 / 0)\n- Knurled section 4 mm high (+/-0.05), diamond knurling on the outside\n- 45 degree internal chamfer\n- Several orthographic views and Section A-A\nTolerances are tight enough to manufacture and inspect against.","u":"https://drive.google.com/ I and performance management presentation, TV production","n":"KPI_TV_Production_WTV.pdf","d":"12-page presentation on using KPIs to drive business performance in TV production.","m":"A 12-page presentation on using Key Performance Indicators within a Performance Management System (PMS).\nIts three objectives:\n- Exchange views on the concept and practice of KPI\n- Share knowledge on business performance areas\n- Cross-learn how to drive business performance through a KPI-based PMS","u":"https://drive.google.com/file/d/1IokcE5KSd6Q_S4ojI1rVZYqrKC4drehf/view","a":"open","o":"walton"}]},{"id":"p15","t":"Lead scrap reduction","m":"Rahimafrooz Globatt","s":"0.65% down to 0.20%. 3rd of 91 teams.","b":"Using PDCA we added a washed paste collection system, modified the COS mould and separator height, added guide bars and a loading car, and recycled connectors. The new method went into the SOPs. The project earned my Lean Six Sigma Green Belt and 3rd place at the BSTQM National Annual Quality Convention.","p":[],"g":["Quality","Improvement"],"x":[{"k":"link","c":"Lead scrap reduction, Green Belt project deck","n":"Lead_Scrap_Reduction_Green_Belt.pdf","d":"38-page Lean Six Sigma Green Belt project report from the Ishwardi plant.","u":"https://drive.google.com/file/d/14EHMpBa7NVmUroiHJhriBgEJBFzEmc-x/view","m":"Full project report for the lead scrap reduction at Rahimafrooz Globatt Ltd, Ishwardi plant.\n- Team page: sponsor, project leader, champion, coordinator and members, with photos and designations\n- Follows the DMAIC steps: problem definition, data collection, root cause analysis, solutions and results\n- Lead scrap fell from 0.65% to 0.20%\nThe project was the basis of my Lean Six Sigma Green Belt certification.","o":"rgl"},{"k":"link","c":"2019 presentation, 23rd National Annual Quality Convention","n":"Final_Presentation_2019_RGL-Surjo.pdf","d":"41-page presentation by the RGL Surjo team at the BSTQM convention, 2019.","m":"The 41-page presentation delivered at the 23rd National Annual Quality Convention 2019, organised by the Bangladesh Society for Total Quality Management (BSTQM). Presented by the Rahimafrooz Globatt (RGL, team Surjo) quality project team. The team placed 3rd of 91 teams.","u":"https://drive.google.com/file/d/19RFPKoXuq-ATqqMJhdd-6w21jFAOaQsu/view","a":"open","o":"rgl"},{"k":"link","c":"2019 presentation, editable PowerPoint (.ppt)","n":"Final_Presentation_2019_RGL-Surjo.ppt","d":"Editable PowerPoint version of the 41-page convention presentation.","m":"Editable PowerPoint version of the 41-page presentation for the 23rd National Annual Quality Convention 2019.","u":"https://drive.google.com/file/d/1503x3P6XJLuusScjmnrhmZhuwk1W7g6m/view","a":"view","o":"rgl"},{"k":"link","c":"Green Belt project, editable PowerPoint (.pptx)","n":"Reduction_of_Lead_Scrap_Final.pptx","d":"Editable PowerPoint version of the lead scrap Green Belt report.","m":"Editable PowerPoint version of the lead scrap reduction Green Belt project report.","u":"https://drive.google.com/file/d/1g8gCT7ee_hruwK0ETR0nayCuuTM48UPy/view","a":"view","o":"rgl"}],"v":{"l":"Lead scrap","a":0.65,"b":0.2,"u":"%"}},{"id":"p16","t":"Audit Assistant (Inventory Auditor Pro)","m":"Brandt","s":"Mobile inventory app: logging from hours to seconds.","b":"Built on Google AppSheet for desktop, mobile and tablet. Staff log counts in about a second, mismatches are detected in real time, tasks are assigned per employee, and the app reports into existing systems. Replaces a paper-based practice. The site cites about 30% time savings.","p":["Real-time error detection","Continuous monitoring without disrupting business","Actionable reports"],"g":["Data"],"x":[{"k":"link","u":"https://sites.google.com/view/mdshahariarahmed","c":"See it on my portfolio site","o":"brandt"},{"k":"link","c":"Inventory process comparison: manual vs mobile app","n":"Inventory_Process_Comparison.pdf","d":"Flowchart comparing the old paper inventory count with the Inventory Auditor Pro app.","m":"Flowchart made with Mermaid and GitHub Copilot to show why paper counting should move to a mobile app.\nManual process, problems:\n- 1 to 2 months of preparation, with a paper pre-count\n- Operations, delivery and receiving halted during the count\n- Team under pressure, so more mistakes; records redone\n- Manual adjustment needed in the Brandt system\n- New parts arriving after counting cause mismatches\nMobile app process, benefits:\n- Scan or enter the item on a phone, with automatic mismatch detection\n- About 10 seconds per item, as stated in the chart\n- No paperwork, instant update and report\n- No disruption to operations, and records stay accurate all year","u":"https://drive.google.com/file/d/1hlmkiU5mfTeyi4IMjsfSXJQyPyESngeI/view","a":"open","o":"brandt"}]},{"id":"p17","t":"Poka-Yoke packing system","m":"Brandt","s":"Mistake-proofing to reduce order errors.","b":"","p":[],"g":["Quality"],"x":[]}]},{"id":"quality","title":"Quality and data","blurb":"Tests, reports, analysis and dashboards.","items":[{"id":"q1","t":"SPC and CpK, pasted plate production","m":"Rahimafrooz Globatt","s":"Statistical process capability evaluation.","b":"","p":[],"g":["Quality"],"x":[{"k":"link","c":"SPC and CpK, pasted plate, Apr 2017","n":"SPC_Pasted_Plate_Apr_2017.xlsx","d":"Process capability (CpK) of pasted plate production, model ERX0.75, April 2017.","u":"https://drive.google.com/file/d/1KvTCc5DrX4B_FkEOHHJ5HQ_X4ercLW_S/view","m":"Statistical process control evaluation of pasted plate production for model ERX0.75, April 2017, focused on process capability (CpK).","o":"rgl","a":"view"},{"k":"link","c":"SPC 2017 files (ZIP)","n":"SPC-2017.zip","d":"ZIP archive of the 2017 SPC files.","m":"ZIP archive of statistical process control files from 2017. The individual file list is not recorded.","u":"https://drive.google.com/file/d/1ytEhJaFd96hyUffxmF9IHv3G4Psr61k4/view","a":"view","o":"rgl"}]},{"id":"q2","t":"Manufacturing Quality Index report","m":"Rahimafrooz Globatt","s":"Mon },{"id":"d5","t":"BSTQM Quality Convention certificate","m":"23rd National Annual Quality Convention, Bangladesh","s":"3rd place of 91 teams, as team facilitator.","b":"","p":[],"g":["Award"],"x":[]},{"id":"d6","t":"Class 5 driver's licence","m":"Saskatchewan","s":"","b":"","p":[],"g":["Licence"],"x":[]}]},{"id":"skills","title":"Skills and tools","blurb":"Methods and software I use.","items":[{"id":"k1","t":"Design and engineering","m":"","s":"SolidWorks, AutoCAD, layouts, jig and fixture design.","b":"","p":["SolidWorks, AutoCAD","Layout and process-flow design","Jig and fixture design, product and tool optimisation"],"g":["Design"],"x":[]},{"id":"k2","t":"Quality and analysis","m":"","s":"FMEA, root cause, SPC, CpK, PDCA, Lean Six Sigma.","b":"","p":["FMEA and risk assessment","Root cause analysis, fishbone, 5 Whys","SPC, CpK, Pareto","PDCA, Lean, Lean Six Sigma Green Belt"],"g":["Quality"],"x":[]},{"id":"k3","t":"Project, finance and data tools","m":"","s":"Charters, Gantt charts, budgets, dashboards and apps.","b":"","p":["Project charters, Gantt charts, OPEX and CAPEX, costing and feasibility","Vendor and supplier negotiation","Advanced Excel, Python","Looker Studio, Power BI, Google AppSheet","ISO 9001, ISO 14001, OHSAS 18001"],"g":["Data","Projects"],"x":[]}]},{"id":"stories","title":"How I work","blurb":"Short stories on installing, testing and running projects.","items":[{"id":"t1","t":"How I install a machine","m":"Walton","s":"From feasibility to handover.","b":"Every machine started with a feasibility study and supplier quotations. I built the layout and schedule, gave construction the weight, load and foundation data, and prepared the site. After installation we ran trials, checked output against our quality requirements, ran a small pilot batch and handed over to Production with SOPs.","p":[],"g":["Machines"],"x":[]},{"id":"t2","t":"How I validate a change","m":"Walton","s":"A fix is finished only when an independent test proves it.","b":"For the open-cell breakage fix I did not rely on the production line alone. The Research & Innovation team tested it with vibration, shock and transportation simulations before release.","p":[],"g":["Testing"],"x":[]},{"id":"t3","t":"How I handle a failed trial","m":"Walton","s":"Record, find the cause, change one thing, retest.","b":"The first hand-pressed jig worked but caused blisters. I went back to the design and built the machine in phases until it was fast and safe.","p":[],"g":["Improvement"],"x":[]},{"id":"t4","t":"How I run a project","m":"Walton","s":"Charter, Gantt, budget, change control, monthly report.","b":"I coordinated Engineering, Manufacturing, Purchasing and Sales, tracked scope, schedule and cost, controlled change requests and reported monthly.","p":[],"g":["Projects"],"x":[{"k":"link","c":"Monthly report, Project and Operational Development, Dec 2022","n":"Project_Operational_Development_Dec_2022.pdf","d":"Monthly progress report for December 2022: 98% overall progress.","m":"The monthly report of the Project and Operational Development team, Process Development Department (TV), for December 2022.\n- Overall progress shown as 98%, with progress bars for Task 1, Task 2 and Task 3\n- Prepared by Md. Abdulla Al Mamun; checked and approved by me\nThis is the regular format I used to update management each month.","u":"https://drive.google.com/file/d/1xD4m7a4WRVfW7-t-BJbph7QDXYk4b6Ce/view","a":"open","o":"walton"}]}]},{"id":"report22","title":"2022 Product Support Report","blurb":"Walton TV Process Development, Jan to Dec 2022. Savings, machines and improvements, with the full PDF.","items":[{"id":"r1","t":"2022 report: results and savings","m":"Walton TV Process Development (Product Support), Jan to Dec 2022","s":"BDT 4,104,360 saved in 2022. 145 SOP and CTQ documents, 16 tool designs and 24 improvements.","b":"The master report of the TV Process Development team for 2022. It covers cost savings, SOP and tool handovers, machine use, avoided investments and 24 improvements, month by month.\nPrepared by Md. Mehedi Rahman. Approved by me, Md. Shahariar Ahmed.","p":["Total savings in 2022: BDT 4,104,360. December: BDT 294,690. Continuous savings: BDT 201,012","Monthly savings (BDT): Jan 32,280 | Feb 94,280 | Mar 95,887 | Apr 108,883 | May 125,088 | Jun 277,873 | Jul 155,988 | Aug 244,188 | Sep 1,170,411 | Oct 957,711 | Nov 547,086 | Dec 294,690","Handed over: 145 SOP and CTQ documents, 5 process flows, 8 parameter sheets and 16 tool designs","SOPs by section: Speaker 57, TV Assembly 12, Sheet Metal 3, Remote 17, Panel Manufacturing 17, MI Line 14, CNC 2, General 16, Powder Coating 5, Injection Molding 1, LGP-LDP 1","Factory context: TV area 46,350 square metres, capacity 1 million TV a year, sizes 24 to 65 inch, ISO class 7 panel assembly room"],"g":["Data","Projects"],"x":[{"k":"link","u":"https://drive.google.com/file/d/1P57y6L4yfw8AihyEHmy4sNkbdGlKDVU6/view?usp=drivesdk","c":"2022 Report Master File (PDF on Google Drive)","d":"32-page master report of the Process Development (Product Support) team for 2022.","a":"open","n":"2022_Report_Master_File.pdf","m":"The main annual report of the TV Process Development (Product Support) team for 2022. 32 pages. Prepared by Md. Mehedi Rahman; approved by me.\nFour main sections:\n- Cost savings activities\n- SOP, CTQ, parameter, process flow and tool development\n- Design fault reduction activities, from the process side\n- Machine utilization, by tag\nAims stated in the report:\n- Reduce factory overhead (FOH) by involving cross-functional teams early in ideation\n- Set realistic development timelines\n- Develop products through a proper system, not ad-hoc methods","o":"walton"}]},{"id":"r2","t":"2022 improvements, month by month","m":"Walton TV Process Development, 2022","s":"24 improvements in reuse, wastage, handling and cycle time.","b":"Each improvement has a before and after, photos and test results in the full report.","p":["Jan: Finished TV storage. Layers per column 5 to 6, floor area 54,344 to 47,887 sq ft, TVs stored 68,587 to 75,186 (ladder added, carton orientation changed)","Feb: Re-use of faulty 43MX and 55RU speakers. 280 of 317 reused, BDT 62,238 of BDT 89,268, rework SOP written","Mar: Remote heat oven. Remotes per tray 21 to 28, per oven 1,092 to 1,456, power 591 to 426 KW a month (keypad orientation changed)","Apr: Cloth tape in 32R series TV. Tape 6 to 4 pieces, cycle time 15 to 10 s (lamp-raise punching pin omitted in sheet metal)","May: Non-moving screws BA3*8-H-B-40D-RO. 32,720 pieces reused, BDT 13,680","May: Non-moving 20 inch TV stand poly. 828 pieces reused as accessory bags, BDT 2,525","Jun: Non-moving back cabinet nut for 24 inch LED TV. 20,000 pieces reused by modifying the in-nut molding pin, BDT 168,990","Jul: Voice coil jig removal machine. 15 to 9 s for 6 pieces","Jul: Mylar tape instead of black masking tape in the 32D120 back cabinet. Tape price 1.25 to 0.89 BDT, monthly expense BDT 53,169 to 37,929","Jul: Dust caps saved from faulty speakers with a thin plier, BDT 6,029 a month","Jul: Cables saved from faulty speakers by de-soldering, BDT 25,851 a month, rework SOP written","Aug: Back cabinet transfer pallet. MS angle to MS box pipe, 30.2 to 22.2 kg, BDT 3,250 to 3,103 each","Sep: Tweeter removal jig for RU-55 speaker rework. 20 to 6 s","Sep: 24 inch Coolita styrofoam made in-house instead of imported. Import BDT 1,065,112 against BDT 135,075 for in-house modification","Sep: EVA foam tape reuse. 19,616 pieces from the wastage list, BDT 85,386, passed shock, vibration and transport tests","Oct: Metal back cabinet transport ramp with tractor. People 6 to 2, hand lifts 6 to 1","Oct: Speaker lead wire. Incoming length 50 to 40 mm, wastage 23 to 13 mm, monthly expense BDT 81,423 to 72,625","Oct: 29 old ionizing air blowers restored by 3R analysis, rust removed by chemical treatment, BDT 657,459","Oct: 24 inch LED bar from non-moving stock. 1,500 pieces used instead of ordering 1,800 new, BDT 99,240 of BDT 121,554","Nov: Unused spider glue. 11 kg moved to the carpenter section, BDT 33,464","Nov: Non-moving 43 inch smart voice control TV cartons. 1,642 pieces rebuilt as 24 inch panel cartons, BDT 300,486","Nov: Rusty U-yoke. 4,500 pieces recovered with 3% hydrochloric acid, anti-rust agent and zinc coating, BDT 12,126","Dec: Out-of-size ESD cloth. 49 of 50 pieces modified and reused, BDT 75,325","Dec: WE32RS TV stand base. 1,506 pieces reused after drilling the leg height, BDT 18,040"],"g":["Improvement"],"x":[]},{"id":"r3","t":"Machine utilization and unused machines, 2022","m":"Walton TV Process Development, 2022","s":"271 machines, 257 in use, 14 unused. Utilization 85.7% to 96.8% by tag.","b":"The report checks every machine, equipment, mold and die by tag: Production Management, Quality Management and Research and Innovation. The 14 unused machines are listed below with the reason. Their total cost is 4,978,324 and their written-down value is 3,325,716, as shown in the report.","p":["Production Management: 187 machines, 6 unused, utilization 96.8%","Quality Management: 35 machines, 5 unused, utilization 85.7%","Research and Innovation: 49 machines, 3 unused, utilization 93.9%","TV assembly line (CRT TV line), TV production, in service May 2019, cost 1,544,587. Not in use because of less demand","Riveting machine, cutting machine, TV production, Jul 2013, cost 120,929. Not found physically","Multi range power supply PSW250-4.5, television, Aug 2022, cost 99,639. Very old and physically damaged","Signal testing machine, TV production, Dec 2018, cost 99,934. Very old and physically damaged","Punching cutting machine, remote production, May 2019, cost 78,118. Manual single-die press, replaced by a multi-die cutting machine","Hydraulic power press, remote production, Jul 2013, cost 362,788. Never used in the remote section","Torque meter testing machine, R&D TV, May 2019, cost 34,752. Technical issue, tag number does not match","Video pattern generator (DVI/HDMI V1.3), R&D TV, May 2019, cost 954,506. Output not working, supplier informed","Voltage testing machine, R&D TV, Dec 2018, cost 1,235,568. Technical issue","Signal box model AG 525, TV QC, May 2019, cost 100,607. Damaged (no power fault)","Signal box model AG 525, TV QC, Mar 2021, cost 115,094. Damaged (IC fault)","MOS transistor selector machine, TV QC, May 2019, cost 31,474. A more precise machine does the same job","Transistor thermal sensitive parameter selector, TV QC, May 2019, cost 85,234. Used for DIP transistor testing, no current model uses DIP transistors","Signal box model AG 525, TV QC, Mar 2021, cost 115,094. Damaged (aging fault)"],"g":["Machines"],"x":[]},{"id":"r4","t":"Investment optimization by process verification, 2022","m":"Walton TV Process Development, 2022","s":"USD 618,000 (BDT 6.18 crore) of purchases avoided in the top five cases.","b":"Before new equipment or imported parts were bought, the process team verified the need. The five biggest cases saved USD 2,500, 400,000, 102,000, 80,500 and 33,000, which is USD 618,000 in total.","p":["24 inch Coolita styrofoam packing: 5,000 pieces were to be ordered from China to meet the world cup schedule. A sample TV with in-house styrofoam showed no abnormalities","600 ton and 300 ton power presses: at the forecast of 80,000 TV a month they would sit idle, so buying them was not recommended","Panel assembly clean room: set the standard by particle count instead of ISO class, because class 7 and class 8 differ by about 90,000 particles at 0.5 micron. With 1,000 sq ft of added space this saved USD 102,000","Clean room climate: 25 +/- 3 C and 50 to 70% RH instead of 35 to 50% RH lowers the investment and regular maintenance cost","Milling machine: two vertical heavy duty bed type milling machines were lying unused in building 10 and fit the TV need, so no new machine was bought"],"g":["Projects","Data"],"x":[]}]},{"id":"portfolio","title":"Portfolio","blurb":"My portfolio document.","items":[{"id":"pf1","t":"Portfolio document","m":"Google Doc","s":"Career profile, projects and credentials in one document.","b":"","p":[],"g":["Portfolio"],"x":[{"k":"link","c":"Portfolio, Md Shahariar Ahmed","n":"PORTFOLIO_MD_SHAHARIAR_AHMED","d":"My professional portfolio as a Google Doc.","m":"Professional portfolio of Md. Shahariar Ahmed covering career, key projects and credentials.","u":"https://drive.google.com/file/d/1YeOmqIm5VK554UJaWZ0lLoASO5RxXk8h/view","a":"open","o":"portfolio"}]}]},{"id":"wtv","title":"Machines commissioned","blurb":"Walton machine projects, Dec 2022 report.","items":[{"id":"w0","t":"Project and operational development dashboard, Dec 2022","m":"Walton TV Process Development, monthly report for Dec 2022","s":"17 projects: 7 completed, 8 on going, 2 in planning. Overall progress 98%.","b":"I checked and approved this monthly report, prepared by my project coordinator, Md. Abdulla Al Mamun, for the Process Development Department (TV).","p":["Total 17 projects: 7 completed, 8 on going, 2 in planning","Monthly schedule met: 96% to 100%, Jul 2022 to Jan 2023","Completed: voice coil jig removal, U-yoke cutting, stand-bush press and TSD cleanroom modification, plus other projects reported earlier","In planning: auto sealing machine (approved, in-house modification) and conformal coating (in-house support)","On going: PAD painting trials, sand blasting machine (needs approval), servo tapping machine (after the press), knurling nut"],"g":["Projects","Data"],"x":[{"k":"link","c":"Project and Operational Development monthly report, Dec 2022","n":"Project_Operational_Development_WTV_Jan_23.pdf","d":"Walton internal report: project status, budgets, progress and schedule met.","o":"walton"}],"pg":null},{"id":"w1","t":"400-ton power press (HCDS-400)","m":"Hwail Press, Incheon, South Korea","s":"USD 259,400. Started Sep 2021. 93% in Dec 2022, in installation phase.","b":"The sheet metal section needed extra capacity for the production plan of 80,000 televisions a month. Shipment was delayed 3 months by a management decision. Benefit: more production capacity.","p":["H-frame double crank press, 400 ton, 37 kW main motor with inverter, die height 600 mm","Start 1 Sep 2021, planned end 28 Feb 2022, 394 days estimated","I was Project Manager. Md. Abdulla Al Mamun was project coordinator."],"g":["Machines","Projects"],"x":[],"pg":93},{"id":"w2","t":"Sealant dispensing machine and line","m":"MET Advanced Technology Systems, Izmir, Turkiye","s":"USD 180,000. Started May 2021. 74.5%, trial phase at the supplier.","b":"Sealant was applied by hand, which is difficult on large TVs. An automatic system saves 10 people. Open-cell resolvable share was taken as 60% from R&I data; below 10% of the claim amount the project would not pay back. The machine can move to another TV or panel line if the technology changes.","p":["Reference MET202110","Start 24 May 2021, planned end 28 Feb 2023, 645 days estimated","Budget on the project sheet: USD 190,000","I was Project Manager. Md. Abdulla Al Mamun was project coordinator."],"g":["Machines","Cleanroom"],"x":[],"pg":74.5},{"id":"w3","t":"Engraving and highlighting machine DA-2080S","m":"Dongguan Di Ao CNC Equipment, Guangdong, China","s":"USD 51,082. Started Sep 2021. 75%, in shipment clearance.","b":"Design-specific requirement for the 55RUG and 32ERS models. After aluminium processing on our own CNC, the machine highlights the aluminium channel in-house, so raw material no longer needs importing. Wastage on the last imported lot was about 31 lakh BDT.","p":["Start 15 Sep 2021, planned end 31 May 2023, 623 days estimated","Budget on the project sheet: USD 56,000","I was Project Manager. Md. Abdulla Al Mamun was project coordinator."],"g":["Machines","Projects"],"x":[],"pg":75},{"id":"w4","t":"Servo tapping machine, 70 inch","m":"Dongguan Gaoneng Hardware Machine, Shenzhen, China","s":"USD 19,560. Started Nov 2021. 87%, in installation phase.","b":"Plan to produce 55 to 75 inch TVs needed a high-capacity servo tapping machine. Production capacity rises to 75 inch. The machine is needed after the 400-ton press is installed.","p":["Model: 260 bearing automatic tapping machine-70","Start 1 Nov 2021, planned end 30 Mar 2023, 333 days estimated","Budget on the project sheet: USD 18,233","I was Project Manager. Md. Abdulla Al Mamun was project coordinator."],"g":["Machines"],"x":[],"pg":87},{"id":"w5","t":"Knurling nut project (CK30 CNC lathe)","m":"Cixi Dongni Machinery, Zhejiang, China","s":"USD 21,986. Started Oct 2022. 39%, in handover phase.","b":"Imported nuts are expensive. Using our own facility gives a much lower price per piece and better quality.","p":["Start 15 Oct 2022, planned end 31 Dec 2023, 442 days estimated","I was Project Manager. Md. Abdulla Al Mamun was project coordinator."],"g":["Machines","Projects"],"x":[],"pg":39},{"id":"w6","t":"Hot stamping machine 5B-1300","m":"LC Printing Machine Factory, Guangzhou, China","s":"USD 11,745. Started Jan 2022. 100%, handover completed.","b":"Needed for the bezel-less 32D210 model, to give the television a premium look. It starts with 32 inch but can stamp up to 55 inch.","p":["Heat transfer hot stamping machine","Start 27 Jan 2022, planned end 31 Dec 2022, 338 days estimated","I was Project Manager. Md. Abdulla Al Mamun was project coordinator."],"g":["Machines"],"x":[],"pg":100},{"id":"w7","t":"U-yoke cutting machine","m":"Walton speaker section","s":"USD 1,350. Started Jan 2022. 100%, installation completed.","b":"Machine installed and completed as part of the speaker process projects.","p":["Start 15 Jan 2022, 289 days estimated","I was Project Manager. Md. Abdulla Al Mamun was project coordinator."],"g":["Machines"],"x":[],"pg":100},{"id":"w8","t":"Voice coil jig removal machine","m":"Walton speaker section","s":"USD 1,000. Started May 2022. 100%, completed.","b":"Completed successfully. The cycle-time result is on its own project page.","p":["Start 14 May 2022, 135 days estimated","I was Project Manager. Md. Abdulla Al Mamun was project coordinator."],"g":["Machines","Improvement"],"x":[],"pg":100}]}]}</script>
